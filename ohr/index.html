<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" /><title>Ohr | Conexão diária com HaShem</title><meta name="theme-color" content="#b88a2b" /><meta name="description" content="Ohr — conexão diária com HaShem, com orações, reflexões e um espaço calmo para hitbodedut." /><link rel="manifest" href="manifest.json" /><link rel="icon" href="icon.svg" type="image/svg+xml" /><link rel="apple-touch-icon" href="icon.svg" /><style>body{font-family:system-ui,sans-serif;background:#f8f4eb;color:#1d2430;margin:0;padding:24px}h1{font-size:42px;margin:0 0 8px}p{line-height:1.6}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;max-width:680px;box-shadow:0 10px 30px rgba(0,0,0,.08)}button{background:#b88a2b;color:#162235;border:none;border-radius:999px;padding:12px 18px;font-weight:700}body.night{background:#07111d;color:#f4efe6}.night .card{background:#0d1826;border-color:#2a3442}</style></head><body><div class="card"><h1>Ohr</h1><p>Conexão diária com HaShem.</p><p>Este é o primeiro deploy do app PWA. A próxima versão pode trazer o visual completo.</p><button id="installBtn" hidden>Instalar app</button></div><script>function upd(){const h=new Date().getHours();document.body.classList.toggle('night',h>=18||h<6)}upd();setInterval(upd,60000);let deferredPrompt=null;const installBtn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false;});installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true;});if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));}</script></body></html>
