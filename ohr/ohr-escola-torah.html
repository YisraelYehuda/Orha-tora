<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escola Torah — Ohr</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: #8a6f2e;
    --dark: #0a0a0f;
    --dark-mid: #111118;
    --dark-card: #15151f;
    --dark-border: #1e1e2e;
    --text: #e8dfc8;
    --text-dim: #8a8070;
    --blue-acc: #3a5fa0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'EB Garamond', serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  /* HEADER */
  .header {
    text-align: center;
    padding: 32px 0 28px;
    border-bottom: 1px solid var(--dark-border);
    margin-bottom: 28px;
  }

  .header-icon {
    font-size: 30px;
    display: block;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 14px rgba(201,168,76,0.5));
  }

  .header h1 {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .header p {
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 8px;
    font-style: italic;
  }

  /* DAY BADGE */
  .day-badge {
    text-align: center;
    margin-bottom: 20px;
  }

  .day-inner {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(201,168,76,0.08);
    border: 1px solid var(--gold-dim);
    border-radius: 24px;
    padding: 8px 20px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  /* WEEK NAV */
  .week-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }

  .week-tab {
    background: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    transition: all 0.2s;
  }

  .week-tab:hover { border-color: var(--gold-dim); color: var(--gold); }
  .week-tab.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.07); }

  .week-icon { display: block; font-size: 18px; margin-bottom: 4px; }

  /* TODAY CARD */
  .today-card {
    background: var(--dark-card);
    border: 1px solid var(--gold-dim);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
    position: relative;
    animation: fadeUp 0.5s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .today-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-dim));
  }

  .today-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--dark-border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .today-meta {}

  .today-tag {
    font-size: 10px;
    font-family: 'Cinzel', serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    display: block;
    margin-bottom: 6px;
  }

  .today-title {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }

  .today-icon-big {
    font-size: 36px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 10px rgba(201,168,76,0.3));
  }

  .today-body {
    padding: 20px 24px;
  }

  .hebrew-highlight {
    font-size: 20px;
    color: var(--gold);
    font-style: italic;
    display: block;
    margin-bottom: 12px;
    border-left: 2px solid var(--gold-dim);
    padding-left: 14px;
  }

  .lesson-text {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 16px;
  }

  .lesson-text strong {
    color: var(--gold-light);
    font-weight: 600;
  }

  .key-point {
    background: rgba(201,168,76,0.06);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  .key-point-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold-dim);
    display: block;
    margin-bottom: 6px;
  }

  .key-point-text {
    font-size: 15px;
    color: var(--text);
    line-height: 1.6;
    font-style: italic;
  }

  .source-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    letter-spacing: 0.5px;
  }

  /* LESSONS LIST */
  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 14px;
    padding-left: 4px;
  }

  .lessons-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 28px;
  }

  .lesson-item {
    background: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .lesson-item:hover { border-color: var(--gold-dim); }
  .lesson-item.active { border-color: var(--gold); background: rgba(201,168,76,0.05); }
  .lesson-item.today-item { border-color: var(--gold); }

  .lesson-num {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--text-dim);
    min-width: 28px;
    text-align: center;
  }

  .lesson-icon-sm {
    font-size: 20px;
    flex-shrink: 0;
  }

  .lesson-info { flex: 1; }

  .lesson-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    display: block;
    margin-bottom: 2px;
  }

  .lesson-week-tag {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
  }

  .lesson-arrow {
    color: var(--gold-dim);
    font-size: 14px;
    flex-shrink: 0;
  }

  .today-marker {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    background: var(--gold);
    color: var(--dark);
    border-radius: 8px;
    padding: 2px 8px;
    letter-spacing: 1px;
  }

  /* EXPANDED LESSON */
  .expanded-lesson {
    display: none;
    background: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: 14px;
    padding: 20px;
    margin-top: -4px;
    margin-bottom: 8px;
    animation: fadeUp 0.3s ease;
  }

  .expanded-lesson.show { display: block; }
  .expanded-lesson .lesson-text { font-size: 15px; }
  .expanded-lesson .key-point { background: rgba(201,168,76,0.04); }

  /* PROGRESS */
  .progress-section {
    margin-bottom: 24px;
  }

  .progress-card {
    background: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: 12px;
    padding: 16px 20px;
  }

  .prog-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .prog-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .prog-value {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: var(--gold);
  }

  .prog-bar {
    height: 3px;
    background: var(--dark-border);
    border-radius: 2px;
    overflow: hidden;
  }

  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(201,168,76,0.3);
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <span class="header-icon">📜</span>
    <h1>Escola Torah</h1>
    <p>Uma lição por dia — 28 dias de sabedoria sagrada</p>
  </div>

  <div class="day-badge">
    <div class="day-inner">
      📅 Dia <span id="currentDayDisplay">1</span> de 28 &nbsp;·&nbsp; <span id="weekLabel">Semana 1</span>
    </div>
  </div>

  <!-- WEEK TABS -->
  <div class="week-tabs">
    <div class="week-tab active" onclick="selectWeek(1)" id="wtab1">
      <span class="week-icon">🌿</span>7 Leis de Noé
    </div>
    <div class="week-tab" onclick="selectWeek(2)" id="wtab2">
      <span class="week-icon">✡️</span>Judaísmo
    </div>
    <div class="week-tab" onclick="selectWeek(3)" id="wtab3">
      <span class="week-icon">📖</span>Figuras
    </div>
    <div class="week-tab" onclick="selectWeek(4)" id="wtab4">
      <span class="week-icon">🕯️</span>Festas e Shabat
    </div>
  </div>

  <!-- TODAY'S LESSON -->
  <div id="todaySection">
    <p class="section-title">✦ Lição de Hoje</p>
    <div class="today-card" id="todayCard">
      <div class="today-header">
        <div class="today-meta">
          <span class="today-tag" id="todayTag">Semana 1 · Dia 1</span>
          <span class="today-title" id="todayTitle">Carregando...</span>
        </div>
        <span class="today-icon-big" id="todayIcon">📜</span>
      </div>
      <div class="today-body">
        <span class="hebrew-highlight" id="todayHebrew"></span>
        <p class="lesson-text" id="todayText"></p>
        <div class="key-point" id="todayKeyPoint">
          <span class="key-point-title">✦ Ponto Central</span>
          <span class="key-point-text" id="todayKey"></span>
        </div>
        <span class="source-tag">📚 Fonte: <span id="todaySource"></span></span>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-section">
    <div class="progress-card">
      <div class="prog-row">
        <span class="prog-label">Progresso do Ciclo</span>
        <span class="prog-value" id="progValue">1 / 28</span>
      </div>
      <div class="prog-bar">
        <div class="prog-fill" id="progFill" style="width:3.5%"></div>
      </div>
    </div>
  </div>

  <!-- LESSONS LIST -->
  <div id="lessonsSection">
    <p class="section-title" id="lessonsSectionTitle">✦ Semana 1 — As 7 Leis de Noé</p>
    <div class="lessons-grid" id="lessonsList"></div>
  </div>

</div>

const weekTitles = [
  '',
  '✦ Semana 1 — As 7 Leis de Noé',
  '✦ Semana 2 — Conceitos do Judaísmo',
  '✦ Semana 3 — Figuras da Torah',
  '✦ Semana 4 — Festas e Shabat'
];

// STATE
let currentDay = 1;
let selectedWeek = 1;
let expandedLesson = null;

function loadDay() {
  const saved = localStorage.getItem('ohr_escola');
  if (saved) {
    const s = JSON.parse(saved);
    const lastDate = s.lastDate || '';
    const today = new Date().toDateString();
    if (lastDate !== today && s.currentDay < 28) {
      currentDay = (s.currentDay % 28) + 1;
      localStorage.setItem('ohr_escola', JSON.stringify({ currentDay, lastDate: today }));
    } else {
      currentDay = s.currentDay || 1;
    }
  } else {
    localStorage.setItem('ohr_escola', JSON.stringify({ currentDay: 1, lastDate: new Date().toDateString() }));
  }
}

function init() {
  loadDay();
  updateDayDisplay();
  renderTodayLesson();
  renderWeek(selectedWeek);
  updateProgress();
}

function updateDayDisplay() {
  document.getElementById('currentDayDisplay').textContent = currentDay;
  const lesson = lessons[currentDay - 1];
  document.getElementById('weekLabel').textContent = 'Semana ' + lesson.week;
}

function renderTodayLesson() {
  const lesson = lessons[currentDay - 1];
  document.getElementById('todayTag').textContent = 'Semana ' + lesson.week + ' · Dia ' + lesson.day;
  document.getElementById('todayTitle').textContent = lesson.title;
  document.getElementById('todayIcon').textContent = lesson.icon;
  document.getElementById('todayHebrew').textContent = lesson.hebrew;
  document.getElementById('todayText').innerHTML = lesson.text;
  document.getElementById('todayKey').textContent = lesson.key;
  document.getElementById('todaySource').textContent = lesson.source;
}

function selectWeek(w) {
  selectedWeek = w;
  document.querySelectorAll('.week-tab').forEach((t, i) => {
    t.className = 'week-tab' + (i + 1 === w ? ' active' : '');
  });
  renderWeek(w);
  expandedLesson = null;
}

function renderWeek(w) {
  const list = document.getElementById('lessonsList');
  document.getElementById('lessonsSectionTitle').textContent = weekTitles[w];
  list.innerHTML = '';
  const weekLessons = lessons.filter(l => l.week === w);
  weekLessons.forEach(lesson => {
    const isToday = lesson.day === currentDay;
    const item = document.createElement('div');
    item.className = 'lesson-item' + (isToday ? ' today-item' : '');
    item.id = 'lesson-item-' + lesson.day;
    item.innerHTML = `
      <span class="lesson-num">Dia ${lesson.day}</span>
      <span class="lesson-icon-sm">${lesson.icon}</span>
      <div class="lesson-info">
        <span class="lesson-name">${lesson.title}</span>
        <span class="lesson-week-tag">${lesson.hebrew}</span>
      </div>
      ${isToday ? '<span class="today-marker">HOJE</span>' : ''}
      <span class="lesson-arrow">›</span>
    `;
    item.onclick = () => toggleLesson(lesson.day);
    list.appendChild(item);

    // Expanded container
    const exp = document.createElement('div');
    exp.className = 'expanded-lesson';
    exp.id = 'exp-' + lesson.day;
    exp.innerHTML = `
      <span class="hebrew-highlight">${lesson.hebrew}</span>
      <p class="lesson-text">${lesson.text}</p>
      <div class="key-point">
        <span class="key-point-title">✦ Ponto Central</span>
        <span class="key-point-text">${lesson.key}</span>
      </div>
      <span class="source-tag">📚 ${lesson.source}</span>
    `;
    list.appendChild(exp);
  });
}

function toggleLesson(day) {
  const exp = document.getElementById('exp-' + day);
  const item = document.getElementById('lesson-item-' + day);
  if (expandedLesson === day) {
    exp.className = 'expanded-lesson';
    item.classList.remove('active');
    expandedLesson = null;
  } else {
    if (expandedLesson) {
      document.getElementById('exp-' + expandedLesson).className = 'expanded-lesson';
      document.getElementById('lesson-item-' + expandedLesson)?.classList.remove('active');
    }
    exp.className = 'expanded-lesson show';
    item.classList.add('active');
    expandedLesson = day;
    setTimeout(() => exp.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
  }
}

function updateProgress() {
  const pct = ((currentDay - 1) / 28) * 100;
  document.getElementById('progFill').style.width = Math.max(3.5, pct) + '%';
  document.getElementById('progValue').textContent = currentDay + ' / 28';
}

init();
</script>
